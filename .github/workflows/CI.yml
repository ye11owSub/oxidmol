# Tests and lint. Wheels and the PyPI upload live in publish.yml, which calls this workflow first.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# a new push cancels the previous run on the same branch/PR (never cancel runs for tags)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: sudo apt-get install -y libegl1 libgles2 libdbus-1-3
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev --no-install-project
      - name: Run Rust tests
        run: cargo test
      - name: Build Python extension
        run: uv run --no-sync maturin develop
      - name: Run Python tests
        run: uv run --no-sync pytest -m "not gpu"
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --group dev --no-install-project
      - name: Check Rust formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check python/
      - name: Run Python linting
        run: uv run --no-sync ruff check python/
      - name: Run mypy
        run: uv run --no-sync mypy python/
