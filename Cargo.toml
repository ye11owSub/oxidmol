[package]
name = "oxidmol-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "oxidmol_render"
crate-type = ["cdylib", "rlib"]

[dependencies]
# graphics
wgpu = { version = "25.0.2", features = ["webgl"] }
raw-window-handle = "0.6.2"
# error handling
thiserror = "2.0.16"
# math
glam = { version = "0.30.7", features = ["bytemuck"] }
bytemuck = "1.25.0"
# logger
log = "0.4.28"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = "0.25.0"
# chemistry
pdbtbx = "0.11"
pollster = "0.4.0"
env_logger = "0.11.8"
# timer
chrono = "0.4.42"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "Window",
  "Document",
  "Element",
] }

[dev-dependencies]
approx = "0.5.1"
